name: Check IdeaGraph
on:
  pull_request:
    branches: [main]
  push:
    branches: [ideagraph-static]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ideagraph-static
          path: dist
          retention-days: 7
